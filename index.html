@keyframes travel{from{offset-distance:0%}to{offset-distance:100%}}
[data-paused=true] .eclipse,[data-paused=true] .transmission i:first-child:after{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){html:not([data-paused=false]) .eclipse,html:not([data-paused=false]) .transmission i:first-child:after{animation-play-state:paused}}
@media(max-width:700px){.eclipse{inset:0 -36% 15% -11%;background-position:62% 36%;mask-image:linear-gradient(#000 53%,transparent)}.transmission{width:150vw;height:90vw;left:6%;top:12%}.identity{padding-top:max(145px,19vh)}h1{font-size:clamp(89px,19vw,132px)}main{padding:25px 7vw 35px}.identity p{font-size:19px}nav{width:100%}.languages{gap:8px}.languages a{padding:6px 13px;gap:8px}.signature{transform:scale(.8);transform-origin:0 0}}

.wake{position:absolute;right:-11%;bottom:8%;width:84%;height:27%;opacity:.46;transform:rotate(-11deg);animation:undulate 8s ease-in-out infinite alternate}
.wake use{stroke-width:1.2}
@keyframes undulate{from{transform:rotate(-12deg) translate(-2%,3%) scaleY(.82)}to{transform:rotate(-8deg) translate(2%,-5%) scaleY(1.22)}}
[data-paused=true] .wake{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){html:not([data-paused=false]) .wake{animation-play-state:paused}}

<main>
<div class="signature" aria-hidden="true"><i></i><b></b></div>
<section class="identity"><h1>Pouya <em>Latifiyan</em></h1><p>Between a signal and a decision.</p></section>
<nav aria-label="Select your language"><h2>Select your language</h2><div class="languages"><a href="/en/" lang="en" hreflang="en"><bdi>English</bdi></a><a href="/fa/" lang="fa" hreflang="fa"><bdi>فارسی</bdi></a><a href="/ar/" lang="ar" hreflang="ar"><bdi>العربية</bdi></a><a href="/zh/" lang="zh" hreflang="zh"><bdi>中文</bdi></a><a href="/fr/" lang="fr" hreflang="fr"><bdi>Français</bdi></a></div></nav>
</main>
<button type="button" class="motion" aria-label="Pause background animation" aria-pressed="false" hidden><span aria-hidden="true">Ⅱ</span></button>
<script>
const button = document.querySelector('.motion');
const preference = matchMedia('(prefers-reduced-motion: reduce)');
const film = document.querySelector('.pulse-film');
function syncFilm() {
  if (document.documentElement.dataset.paused === 'true' || document.hidden) {
    film.pause();
    return;
  }
  if (!film.hasAttribute('src')) film.src = film.dataset.src;
  film.play().catch(() => {});
}
film.addEventListener('playing', () => film.classList.add('playing'));
film.addEventListener('error', () => film.classList.remove('playing'));
document.addEventListener('visibilitychange', syncFilm);
function setPaused(paused) {
  document.documentElement.dataset.paused = String(paused);
  button.setAttribute('aria-pressed', String(paused));
  button.setAttribute('aria-label', paused ? 'Play background animation' : 'Pause background animation');
  syncFilm();
}
setPaused(preference.matches || Boolean(navigator.connection?.saveData));
button.hidden = false;
button.addEventListener('click', () => setPaused(button.getAttribute('aria-pressed') !== 'true'));
preference.addEventListener('change', () => setPaused(preference.matches));
</script></body></html>
